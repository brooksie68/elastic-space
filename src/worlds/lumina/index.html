<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumina</title>
  <link rel="stylesheet" href="./world.css" />
  <link rel="stylesheet" href="./tuner.css" />
</head>
<body>
  <!-- Temporary staging: the field lives in a centered frame (full-window by
       default since 2026-07-27) until
       its final setting is decided. The renderer fills whatever box it's given. -->
  <main class="lum-stage">
    <div id="lumina-frame" class="lum-frame"></div>
  </main>

  <!-- The panel opens from a labelled button; music.js seats it at the end of
       the transport bar. The fixed fallback position in world.css only shows
       if the bar never mounts. -->
  <button id="lum-tuner-toggle" class="lum-tuner-toggle" type="button"
          aria-expanded="false" aria-controls="lum-tuner"
          title="Open the configuration window">configuration</button>

  <!-- The control surface is built into this shell by tuner.js (two tabs:
       visual | audio). The detach button pops the same surface out into
       tuner.html, talking back over BroadcastChannel. -->
  <section id="lum-tuner" class="lum-tuner" role="group" aria-label="Field tuning" hidden></section>

  <script src="./migrate-storage.js"></script>
  <script src="../../core/dashboard-control.js"></script>
  <script src="../../core/sound-control.js"></script>
  <script src="./lumina-field.js"></script>
  <script src="./presets.js"></script>
  <script src="./music-dsp.js"></script>
  <script src="./composition.js"></script>
  <script src="./assets/track-grid.js"></script>
  <script src="./assets/compositions.js"></script>
  <script src="./assets/flame-genomes.js"></script>
  <script src="./scenes.js"></script>
  <script src="./fx.js"></script>
  <script src="./tuner.js"></script>
  <script src="./world.js"></script>
  <script src="./timeline.js"></script>
  <script src="./music.js"></script>
</body>
</html>
