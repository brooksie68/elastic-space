<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surround</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305060c'/%3E%3Cpath d='M6 22 L6 10 L16 10' fill='none' stroke='%2340f2ff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M26 10 L26 22 L16 22' fill='none' stroke='%23ff4fd8' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --p1: #40f2ff;
      --p2: #ff4fd8;
      --bg: #04050a;
      --ink: rgba(235, 240, 255, 0.92);
      --ink-dim: rgba(235, 240, 255, 0.45);
      --glass: rgba(16, 20, 34, 0.55);
      --glass-edge: rgba(255, 255, 255, 0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      overflow: hidden;
      font-family: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif;
      color: var(--ink);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #field { display: block; position: absolute; inset: 0; }

    /* ---- HUD ---- */
    #hud {
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 1.1rem;
      padding: 0.55rem 1.3rem;
      background: var(--glass);
      border: 1px solid var(--glass-edge);
      border-radius: 999px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      z-index: 10;
    }
    .hud-side { display: flex; align-items: center; gap: 0.6rem; }
    .hud-name {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: var(--ink-dim);
    }
    .hud-name.you { color: var(--p1); }
    .hud-name.cpu { color: var(--p2); }
    .pips { display: flex; gap: 0.28rem; }
    .pip {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      transition: background 300ms ease, box-shadow 300ms ease, transform 300ms ease;
    }
    .pip.lit.you { background: var(--p1); box-shadow: 0 0 8px var(--p1); }
    .pip.lit.cpu { background: var(--p2); box-shadow: 0 0 8px var(--p2); }
    .pip.just-lit { transform: scale(1.7); }
    #hud-divider { width: 1px; height: 1.1rem; background: var(--glass-edge); }

    /* ---- center overlays ---- */
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 9;
    }
    #countdown {
      font-size: clamp(5rem, 18vh, 10rem);
      font-weight: 200;
      letter-spacing: 0.06em;
      color: var(--ink);
      text-shadow: 0 0 40px rgba(120, 200, 255, 0.35);
      opacity: 0;
    }
    #countdown.tick { animation: cd 620ms ease-out; }
    @keyframes cd {
      0% { opacity: 0; transform: scale(1.35); filter: blur(6px); }
      25% { opacity: 1; transform: scale(1); filter: blur(0); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: scale(0.92); }
    }
    #banner {
      font-size: clamp(1.6rem, 5vh, 2.6rem);
      font-weight: 250;
      letter-spacing: 0.34em;
      text-indent: 0.34em;
      opacity: 0;
      transition: opacity 400ms ease;
      text-align: center;
    }
    #banner.show { opacity: 1; }
    #banner .sub {
      display: block;
      margin-top: 0.9rem;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.28em;
      color: var(--ink-dim);
    }
    #banner.you { color: var(--p1); text-shadow: 0 0 34px rgba(64, 242, 255, 0.5); }
    #banner.cpu { color: var(--p2); text-shadow: 0 0 34px rgba(255, 79, 216, 0.5); }
    #banner.draw { color: var(--ink); }

    /* ---- title / hint ---- */
    #title {
      position: fixed;
      bottom: 1.1rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.5em;
      text-indent: 0.5em;
      color: var(--ink-dim);
      z-index: 10;
      transition: opacity 1s ease;
    }
    #hint {
      position: fixed;
      bottom: 2.6rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      color: var(--ink-dim);
      z-index: 10;
      transition: opacity 800ms ease;
      white-space: nowrap;
    }
    .faded { opacity: 0 !important; }

    /* ---- tuner ---- */
    #tuner-toggle {
      position: fixed;
      bottom: 1rem;
      left: 1rem;
      z-index: 12;
      background: var(--glass);
      border: 1px solid var(--glass-edge);
      border-radius: 999px;
      color: var(--ink-dim);
      font: 600 0.62rem/1 "Segoe UI", Inter, system-ui, sans-serif;
      letter-spacing: 0.18em;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    #tuner-toggle:hover { color: var(--ink); }
    #tuner {
      position: fixed;
      bottom: 3.4rem;
      left: 1rem;
      z-index: 12;
      width: min(300px, calc(100vw - 2rem));
      background: rgba(10, 13, 24, 0.82);
      border: 1px solid var(--glass-edge);
      border-radius: 14px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 0.9rem 1rem 0.8rem;
      display: none;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    }
    #tuner.open { display: block; }
    .t-row { margin-bottom: 0.7rem; }
    .t-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--ink-dim);
      margin-bottom: 0.3rem;
      text-transform: uppercase;
    }
    .t-label span:last-child { color: var(--ink); }
    .t-row input[type="range"] { width: 100%; accent-color: #6ea8ff; }
    .t-seg { display: flex; gap: 0.3rem; }
    .t-seg button {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--ink-dim);
      font: 600 0.62rem/1 "Segoe UI", Inter, system-ui, sans-serif;
      letter-spacing: 0.08em;
      padding: 0.45rem 0;
      cursor: pointer;
    }
    .t-seg button.on {
      background: rgba(110, 168, 255, 0.16);
      border-color: rgba(110, 168, 255, 0.5);
      color: var(--ink);
    }
    #t-reset {
      width: 100%;
      background: none;
      border: 1px solid var(--glass-edge);
      border-radius: 8px;
      color: var(--ink-dim);
      font: 600 0.6rem/1 "Segoe UI", Inter, system-ui, sans-serif;
      letter-spacing: 0.16em;
      padding: 0.45rem 0;
      cursor: pointer;
      margin-top: 0.1rem;
    }
    #t-reset:hover { color: var(--ink); }
    .t-note {
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      color: rgba(235, 240, 255, 0.3);
      margin-top: 0.55rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="field"></canvas>

  <div id="hud">
    <div class="hud-side">
      <span class="hud-name you">YOU</span>
      <div class="pips" id="pips-you"></div>
    </div>
    <div id="hud-divider"></div>
    <div class="hud-side">
      <div class="pips" id="pips-cpu"></div>
      <span class="hud-name cpu">CPU</span>
    </div>
  </div>

  <div id="overlay">
    <div id="countdown"></div>
    <div id="banner"></div>
  </div>

  <div id="hint">ARROWS / WASD TO STEER — OR SWIPE</div>
  <div id="title">SURROUND</div>

  <button id="tuner-toggle" type="button">TUNE</button>
  <div id="tuner">
    <div class="t-row">
      <div class="t-label"><span>Speed</span><span id="t-speed-val">1.0×</span></div>
      <input id="t-speed" type="range" min="0.6" max="1.6" step="0.05" />
    </div>
    <div class="t-row">
      <div class="t-label"><span>Glow</span><span id="t-glow-val">1.0</span></div>
      <input id="t-glow" type="range" min="0" max="2" step="0.1" />
    </div>
    <div class="t-row">
      <div class="t-label"><span>Arena</span><span></span></div>
      <div class="t-seg" id="t-grid">
        <button data-v="small" type="button">COZY</button>
        <button data-v="medium" type="button">CLASSIC</button>
        <button data-v="large" type="button">VAST</button>
      </div>
    </div>
    <div class="t-row">
      <div class="t-label"><span>Opponent</span><span></span></div>
      <div class="t-seg" id="t-ai">
        <button data-v="1" type="button">DRIFTER</button>
        <button data-v="2" type="button">HUNTER</button>
        <button data-v="3" type="button">ORACLE</button>
      </div>
    </div>
    <div class="t-row">
      <div class="t-label"><span>First to</span><span></span></div>
      <div class="t-seg" id="t-target">
        <button data-v="5" type="button">5</button>
        <button data-v="10" type="button">10</button>
        <button data-v="15" type="button">15</button>
      </div>
    </div>
    <button id="t-reset" type="button">RESET DEFAULTS</button>
    <div class="t-note">arena · opponent · first-to restart the match</div>
  </div>

  <!-- draft world: no drift wiring yet; exits arrive at ship time -->
  <script src="../../core/dashboard-control.js"></script>
  <script src="../../core/sound-control.js"></script>
  <script src="game-core.js?v=1"></script>
  <script src="game.js?v=1"></script>
</body>
</html>
