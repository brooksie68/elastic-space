<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relaaax</title>
  <link rel="stylesheet" href="./world.css" />
  <link rel="stylesheet" href="./tuner.css" />
</head>
<body>
  <!-- Temporary staging: the field lives in a centered 1024×768 frame until
       its final setting is decided. The renderer fills whatever box it's given. -->
  <main class="rlx-stage">
    <div id="relaaax-frame" class="rlx-frame"></div>
  </main>

  <button id="rlx-tuner-toggle" class="rlx-tuner-toggle" type="button"
          aria-expanded="false" aria-controls="rlx-tuner"
          title="Tune the field" aria-label="Tune the field">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" aria-hidden="true">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <circle cx="9" cy="6" r="2.4" fill="currentColor" stroke="none"></circle>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <circle cx="15" cy="12" r="2.4" fill="currentColor" stroke="none"></circle>
      <line x1="3" y1="18" x2="21" y2="18"></line>
      <circle cx="6" cy="18" r="2.4" fill="currentColor" stroke="none"></circle>
    </svg>
  </button>

  <!-- The control surface is built into this shell by tuner.js (two tabs:
       visual | audio). The detach button pops the same surface out into
       tuner.html, talking back over BroadcastChannel. -->
  <section id="rlx-tuner" class="rlx-tuner" role="group" aria-label="Field tuning" hidden></section>

  <script src="../../core/dashboard-control.js"></script>
  <script src="../../core/sound-control.js"></script>
  <script src="./relaaax-field.js"></script>
  <script src="./presets.js"></script>
  <script src="./music-dsp.js"></script>
  <script src="./composition.js"></script>
  <script src="./assets/track-grid.js"></script>
  <script src="./assets/compositions.js"></script>
  <script src="./assets/flame-genomes.js"></script>
  <script src="./scenes.js"></script>
  <script src="./fx.js"></script>
  <script src="./tuner.js"></script>
  <script src="./world.js"></script>
  <script src="./music.js"></script>
</body>
</html>
