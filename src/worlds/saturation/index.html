<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saturation</title>
  <link rel="stylesheet" href="./world.css" />
</head>
<body>
  <div id="grid" aria-hidden="true"></div>
  <button id="cfg-btn" type="button" title="Configuration (C)" aria-label="Configuration">C</button>
  <div id="cfg" hidden>
    <div class="cfg-head">configuration</div>
    <label>folder
      <span class="cfg-dirrow">
        <input id="cfg-dir" type="text" spellcheck="false" placeholder="C:\path\to\images" />
        <button id="cfg-browse" type="button" title="Browse for a folder">…</button>
      </span>
    </label>
    <div id="cfg-status" class="cfg-status">no folder yet — showing colour tiles</div>
    <div class="cfg-row">
      <label>across <input id="cfg-cols" type="number" min="1" max="60" /></label>
      <label>down <input id="cfg-rows" type="number" min="1" max="60" /></label>
    </div>
    <label class="cfg-speed">speed <span id="cfg-speed-val">1×</span>
      <input id="cfg-speed" type="range" min="0" max="1" step="0.002" />
    </label>
    <div class="cfg-row">
      <label>min s <input id="cfg-min" type="number" min="0.05" max="60" step="0.05" /></label>
      <label>max s <input id="cfg-max" type="number" min="0.05" max="60" step="0.05" /></label>
    </div>
    <div class="cfg-row cfg-sweeps">
      <label class="cfg-check"><input id="cfg-sweeps" type="checkbox" /> sweeps</label>
      <label>every min s <input id="cfg-sweep-min" type="number" min="1" max="600" step="0.5" /></label>
      <label>max s <input id="cfg-sweep-max" type="number" min="1" max="600" step="0.5" /></label>
      <label>sweep s <input id="cfg-sweep-len" type="number" min="0.1" max="30" step="0.1" /></label>
    </div>
    <div class="cfg-row">
      <button id="cfg-sweep-now" type="button">sweep now (S)</button>
      <span id="cfg-last" class="cfg-status"></span>
    </div>
    <div class="cfg-row">
      <label>gap px <input id="cfg-gap" type="number" min="0" max="40" /></label>
      <label>fit <select id="cfg-fit"><option value="cover">fill the cell</option><option value="contain">whole picture</option></select></label>
    </div>
    <div class="cfg-row">
      <button id="cfg-pause" type="button">pause</button>
      <button id="cfg-load" type="button">load folder</button>
      <button id="cfg-reset" type="button">defaults</button>
    </div>
  </div>
  <script src="../../core/dashboard-control.js"></script>
  <script src="./sweeps.js"></script>
  <script src="./world.js"></script>
</body>
</html>
