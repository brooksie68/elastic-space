<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Softly</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #field { position: fixed; inset: 0; }
    .wash { position: absolute; inset: 0; opacity: 0; will-change: opacity; }
    /* the three ways out: soft round blurs in the corners without controls, invisible
       until the pointer finds one */
    .drift { position: fixed; width: 34vmin; height: 34vmin; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.5), rgba(255,255,255,0) 70%);
      filter: blur(3vmin); opacity: 0; transition: opacity 2.5s ease; z-index: 2; }
    .drift:hover, .drift:focus-visible { opacity: 0.22; outline: none; }
    .drift.tl { top: -6vmin; left: -6vmin; }
    .drift.bl { bottom: -6vmin; left: -6vmin; }
    .drift.br { bottom: -6vmin; right: -6vmin; }
  </style>
</head>
<body>
  <div id="field" aria-hidden="true"></div>
  <a class="drift tl" data-drift href="../../../index.html" aria-label="Drift somewhere else"></a>
  <a class="drift bl" data-drift href="../../../index.html" aria-label="Drift somewhere else"></a>
  <a class="drift br" data-drift href="../../../index.html" aria-label="Drift somewhere else"></a>
  <script src="../../core/world-registry.js"></script>
  <script src="../../core/drift.js"></script>
  <script src="../../core/dashboard-control.js"></script>
  <script src="../../core/sound-control.js"></script>
  <script src="./world.js"></script>
  <script src="./sound.js"></script>
</body>
</html>
